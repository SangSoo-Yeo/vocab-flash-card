<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영단어 플래시카드</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#17253b;background:#f5f7fb;font-size:16px}*{box-sizing:border-box}body{margin:0;min-width:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;background:white;color:#17253b;border-radius:10px;padding:10px 14px;font-weight:650;min-height:44px}button:hover:not(:disabled){background:#eef3fb}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:#2459d8;color:white;border-color:#2459d8}button.primary:hover:not(:disabled){background:#1b45ae}button.danger{color:#ac2432;border-color:#efc3c8}button.success{color:#08713f;border-color:#9edcb9}input,select,textarea{border:1px solid #b7c3d7;border-radius:9px;padding:11px 12px;min-width:0;width:100%;background:#fff;color:#17253b}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #9dbbf9;outline-offset:1px}header{background:white;border-bottom:1px solid #dee5ee}.shell{width:min(1100px,100%);margin:auto;padding:0 20px}header .shell{padding-top:18px}h1{font-size:1.5rem;margin:0 0 16px}h2{font-size:1.28rem;margin:0}h3{font-size:1.08rem;margin:0 0 14px}.tabs{display:flex;gap:8px}.tabs button{border-radius:9px 9px 0 0;border-bottom:0}.tabs button.active{background:#e9f0ff;color:#174ab7}main{padding-top:24px!important;padding-bottom:56px!important}.panel{background:#fff;border:1px solid #dee5ef;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #1e31500a}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}.actions{display:flex;flex-wrap:wrap;gap:8px}.muted{color:#52637a}.empty{text-align:center;padding:52px 18px}.empty p{line-height:1.6}.set-card{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.set-card h3{margin:0 0 10px;overflow-wrap:anywhere}.stats{display:flex;gap:14px;flex-wrap:wrap;color:#52637a;font-size:.95rem}.set-card .actions{max-width:100%}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{margin:12px 0;padding:13px;border-radius:10px;background:#eaf1ff;color:#173e88;overflow-wrap:anywhere}.error{background:#fff0f0;color:#a0222f}.warning{background:#fff3d9;color:#6c4500;border:1px solid #e5c687}.hidden{display:none!important}#saveWarning{border-radius:0;margin:0;padding:12px 20px;text-align:center}.message{margin:10px 0 16px;min-height:0;color:#155a3b;overflow-wrap:anywhere}.message.err{color:#ab2531}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;border-bottom:1px solid #e4e9f1;padding:10px 8px;vertical-align:middle;overflow-wrap:anywhere}th{color:#445670;background:#f4f7fc}td input{padding:9px 8px}td:nth-child(1){width:6%}td:nth-child(2){width:22%}td:nth-child(3){width:25%}td:nth-child(4){width:25%}td:nth-child(5){width:12%}td:nth-child(6){width:10%}.edit-table th:nth-child(1){width:6%}.edit-table th:nth-child(2){width:22%}.edit-table th:nth-child(3){width:25%}.edit-table th:nth-child(4){width:25%}.edit-table th:nth-child(5){width:12%}.edit-table th:nth-child(6){width:10%}.pill{border-radius:30px;padding:5px 10px;font-size:.89rem;background:#eef2f8;white-space:nowrap;display:inline-block}.pill.correct{background:#e0f5e9;color:#076c40}.pill.wrong{background:#ffe6e6;color:#a02431}.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.option-grid button{text-align:left;min-height:70px}.option-grid button.selected{background:#e8efff;border:2px solid #2459d8;color:#1244ae}.option-grid small{display:block;font-weight:400;margin-top:4px}.radio-row{display:flex;gap:16px;flex-wrap:wrap}.radio-row label{display:flex;align-items:center;gap:8px}.radio-row input{width:auto;accent-color:#2459d8}.start-block{margin-top:22px}.progress-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.progress{height:12px;background:#e2e8f2;border-radius:100px;overflow:hidden}.progress div{height:100%;background:#2459d8;transition:width .2s}.flashcard{margin:24px 0 16px;position:relative;min-height:310px;border:3px solid #cad5ea;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 20px;text-align:center}.question{font-size:clamp(32px,5vw,52px);font-weight:720;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.33}.answer{margin-top:22px;border-top:1px solid #dde5f1;padding-top:22px;width:100%;line-height:1.7;font-size:1.2rem;white-space:pre-wrap;overflow-wrap:anywhere}.hint{margin-top:18px;background:#f1f6ff;border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;width:100%}.feedback-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:100px;font-weight:900;pointer-events:none;opacity:0}.flashcard.feedback-correct{border-color:#16a15d;background:#f2fff8}.flashcard.feedback-wrong{border-color:#db3547;background:#fff5f5}.feedback-correct .feedback-mark{color:#109653;animation:pop .6s ease forwards}.feedback-wrong .feedback-mark{color:#d32e41;animation:pop .6s ease forwards}.flashcard.feedback-wrong{animation:shake .6s ease}.feedback-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.result-stat{font-size:2rem;font-weight:750;margin:6px 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.result-grid>div{border:1px solid #e0e7ef;border-radius:12px;padding:20px 10px}.csv-details{line-height:1.8}.csv-details strong{color:#132a49}#csvPicker{display:none}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition:none!important}.feedback-correct .feedback-mark,.feedback-wrong .feedback-mark{opacity:1}}@media(max-width:700px){.shell{padding-left:12px;padding-right:12px}.panel{padding:16px}.grid3,.grid2,.option-grid{grid-template-columns:1fr}.feedback-actions{grid-template-columns:repeat(2,minmax(0,1fr))}.edit-table,.edit-table tbody,.edit-table tr,.edit-table td{display:block;width:100%!important}.edit-table thead{display:none}.edit-table tr{padding:12px;border:1px solid #d9e2ed;border-radius:12px;margin:10px 0}.edit-table td{border:0;padding:7px 0;display:flex;align-items:center;gap:10px}.edit-table td::before{content:attr(data-label);flex:0 0 64px;font-weight:700;color:#51627c}.edit-table td input{flex:1;min-width:0}.result-grid{gap:6px}.result-grid>div{padding:12px 3px}.result-stat{font-size:1.6rem}}@media(max-width:380px){.tabs button{padding:10px 9px}.stats{gap:8px}.flashcard{min-height:255px;padding:20px 12px}}
</style></head>
<body><div id="saveWarning" class="warning hidden" role="alert">저장에 실패했습니다. CSV로 내보내 백업하세요.</div><header><div class="shell"><h1>영단어 플래시카드</h1><nav class="tabs" aria-label="화면 선택"><button id="tabList" class="active" type="button">카드 세트 목록</button><button id="tabStudy" type="button">학습</button></nav></div></header><main id="app" class="shell"></main><input id="csvPicker" type="file" accept=".csv,.txt,text/csv,text/plain"><script>
'use strict';
(()=>{
const KEY='vocab-flashcards-v1',BROKEN=KEY+'-broken',MAX=2000,VALID=['unseen','correct','wrong'];
let db={sets:[]},screen='list',editing=null,selected='',mode='all',order='shuffle',direction='word',session=null,preview=null,undo=null,undoTimer=null,feedbackTimer=null,notice='',noticeError=false,storageBroken=false;
const $=id=>document.getElementById(id),app=$('app');
const uid=()=>typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setById=id=>db.sets.find(s=>s.id===id);
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const data=JSON.parse(raw);if(!data||!Array.isArray(data.sets)||!data.sets.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&Array.isArray(s.cards)&&s.cards.length<=MAX&&s.cards.every(c=>typeof c.id==='string'&&typeof c.word==='string'&&typeof c.meaning==='string'&&typeof c.hint==='string'&&VALID.includes(c.status))))throw Error('invalid');db=data;}catch(e){try{const raw=localStorage.getItem(KEY);if(raw!==null)localStorage.setItem(BROKEN,raw)}catch(_){}db={sets:[]};storageBroken=true;notice='저장된 데이터를 읽을 수 없습니다';noticeError=true;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('saveWarning').classList.add('hidden')}catch(e){$('saveWarning').classList.remove('hidden')}}
function flash(text,isError=false){notice=text;noticeError=isError;render()}
function counts(set){return {all:set.cards.length,correct:set.cards.filter(c=>c.status==='correct').length,wrong:set.cards.filter(c=>c.status==='wrong').length,unseen:set.cards.filter(c=>c.status==='unseen').length}}
function stats(set){const c=counts(set);return `<div class="stats"><span>전체 <b>${c.all}</b></span><span>맞춤 <b>${c.correct}</b></span><span>틀림 <b>${c.wrong}</b></span><span>미학습 <b>${c.unseen}</b></span></div>`}
function setScreen(to){if(session&&to!=='study'){clearTimeout(feedbackTimer);session=null}screen=to;if(to!=='edit'){undo=null;clearTimeout(undoTimer)}notice='';render()}
function render(){const edit=screen==='edit';$('tabList').classList.toggle('active',screen==='list'||edit);$('tabStudy').classList.toggle('active',screen==='study');$('tabList').setAttribute('aria-current',(screen==='list'||edit)?'page':'false');$('tabStudy').setAttribute('aria-current',screen==='study'?'page':'false');app.innerHTML=(notice?`<div class="notice ${noticeError?'error':''}" role="status">${escapeHtml(notice)}</div>`:'')+(screen==='list'?renderList():edit?renderEdit():renderStudy());bind();}
function renderList(){return `<div class="toolbar"><h2>카드 세트 목록</h2><div class="actions"><button class="primary" data-action="new">새 세트 만들기</button><button data-action="pick">CSV 불러오기</button></div></div>${!db.sets.length?`<div class="panel empty"><p>카드 세트가 없습니다. 새로 만들거나 CSV 파일을 불러오세요.</p><button data-action="sample">샘플 CSV 받기</button></div>`:db.sets.map(s=>`<section class="panel set-card"><div><h3>${escapeHtml(s.name)}</h3>${stats(s)}</div><div class="actions"><button class="primary" data-action="learn" data-id="${escapeHtml(s.id)}">학습하기</button><button data-action="edit" data-id="${escapeHtml(s.id)}">편집</button><button data-action="export" data-id="${escapeHtml(s.id)}">CSV 내보내기</button><button data-action="reset" data-id="${escapeHtml(s.id)}">기록 초기화</button><button class="danger" data-action="deleteSet" data-id="${escapeHtml(s.id)}">삭제</button></div></section>`).join('')}${preview?renderPreview():''}`}
function renderPreview(){const p=preview;const nums=p.skipped.slice(0,10);const others=p.skipped.length-nums.length;return `<section class="panel" id="csvPreview"><div class="toolbar"><h2>CSV 불러오기 미리보기</h2><button data-action="closePreview">닫기</button></div><div class="csv-details"><div>파일: <strong>${escapeHtml(p.filename)}</strong></div><div>새 세트: <strong>${escapeHtml(p.name)}</strong></div><div>가져올 카드: <strong>${p.cards.length}개</strong></div><div>건너뛴 줄: <strong>${p.skipped.length}개</strong>${nums.length?' (줄 번호: '+nums.join(', ')+(others?' 외 '+others+'줄':'')+')':''}</div><div>중복 단어: <strong>${p.duplicates}개</strong></div><div>잘라낸 칸: <strong>${p.trimmed}개</strong></div><div>무시한 열: ${p.unknown.length?escapeHtml(p.unknown.join(', ')):'없음'}</div>${p.truncated?'<div class="notice">카드 수가 2,000개를 초과하여 앞의 2,000개만 가져옵니다.</div>':''}</div><div class="actions" style="margin-top:18px"><button class="primary" data-action="confirmImport">불러오기</button><button data-action="closePreview">취소</button></div></section>`}
function renderEdit(){const s=setById(editing);if(!s){screen='list';return renderList()}return `<div class="toolbar"><h2>카드 세트 편집</h2><button data-action="back">목록으로</button></div><section class="panel"><label class="field"><b>세트 이름</b><input id="setName" maxlength="200" value="${escapeHtml(s.name)}"></label><div style="margin-top:10px">${stats(s)}</div></section><section class="panel"><h3>카드 추가</h3><form id="addCardForm" class="grid3"><label class="field">영단어 (필수)<input name="word" maxlength="100" required></label><label class="field">뜻 (필수)<input name="meaning" maxlength="300" required></label><label class="field">힌트 (선택)<input name="hint" maxlength="300"></label><div><button type="submit" class="primary" ${s.cards.length>=MAX?'disabled':''}>추가</button></div></form>${s.cards.length>=MAX?'<p class="notice error">세트당 최대 2,000개까지 추가할 수 있습니다.</p>':''}</section><section class="panel"><div class="toolbar"><h3 style="margin:0">카드 목록</h3>${undo&&undo.setId===s.id?'<button data-action="undo">삭제 취소</button>':''}</div>${!s.cards.length?'<p class="muted">등록된 카드가 없습니다.</p>':`<table class="edit-table"><thead><tr><th>번호</th><th>영단어</th><th>뜻</th><th>힌트</th><th>상태</th><th>삭제</th></tr></thead><tbody>${s.cards.map((c,i)=>`<tr><td data-label="번호">${i+1}</td><td data-label="영단어"><input class="card-edit" data-id="${escapeHtml(c.id)}" data-field="word" maxlength="100" aria-label="${i+1}번 영단어" value="${escapeHtml(c.word)}"></td><td data-label="뜻"><input class="card-edit" data-id="${escapeHtml(c.id)}" data-field="meaning" maxlength="300" aria-label="${i+1}번 뜻" value="${escapeHtml(c.meaning)}"></td><td data-label="힌트"><input class="card-edit" data-id="${escapeHtml(c.id)}" data-field="hint" maxlength="300" aria-label="${i+1}번 힌트" value="${escapeHtml(c.hint)}"></td><td data-label="상태"><span class="pill ${c.status}">${statusText(c.status)}</span></td><td data-label="삭제"><button class="danger" data-action="deleteCard" data-id="${escapeHtml(c.id)}">삭제</button></td></tr>`).join('')}</tbody></table>`}</section>`}
function statusText(s){return s==='correct'?'맞춤':s==='wrong'?'틀림':'미학습'}
function renderStudy(){if(session?.phase==='run')return renderRunning();if(session?.phase==='result')return renderResult();const s=setById(selected),c=s?counts(s):{all:0,correct:0,wrong:0};const size=mode==='all'?c.all:c[mode];return `<div class="toolbar"><h2>학습 시작</h2></div><section class="panel"><label class="field"><b>카드 세트 선택</b><select id="studySet"><option value="">세트를 선택하세요</option>${db.sets.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===selected?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></label><h3 style="margin-top:24px">학습 모드</h3><div class="option-grid">${[['all','전체 학습',c.all],['correct','맞춘 카드 복습',c.correct],['wrong','틀린 카드 집중 학습',c.wrong]].map(x=>`<button data-action="mode" data-value="${x[0]}" class="${mode===x[0]?'selected':''}" aria-pressed="${mode===x[0]}">${x[1]}<small>${x[2]}개 카드</small></button>`).join('')}</div><div class="grid2" style="margin-top:24px"><div><h3>카드 순서</h3><div class="radio-row"><label><input type="radio" name="order" value="shuffle" ${order==='shuffle'?'checked':''}>섞기</label><label><input type="radio" name="order" value="original" ${order==='original'?'checked':''}>원래 순서</label></div></div><div><h3>카드 방향</h3><div class="radio-row"><label><input type="radio" name="direction" value="word" ${direction==='word'?'checked':''}>영단어 → 뜻</label><label><input type="radio" name="direction" value="meaning" ${direction==='meaning'?'checked':''}>뜻 → 영단어</label></div></div></div><div class="start-block">${!size?'<p class="notice">해당하는 카드가 없습니다</p>':''}<button class="primary" data-action="start" ${size?'':'disabled'}>시작</button></div></section>`}
function renderRunning(){const x=session,s=setById(x.setId),id=x.ids[x.index],card=s?.cards.find(c=>c.id===id);if(!card){session=null;return renderStudy()}const question=x.direction==='word'?card.word:card.meaning;return `<section class="panel"><div class="progress-head"><h2>${x.index+1} / ${x.ids.length}</h2><button data-action="stop">학습 종료</button></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${x.ids.length}" aria-valuenow="${x.index}"><div style="width:${100*x.index/x.ids.length}%"></div></div><div id="studyCard" class="flashcard"><div class="question">${escapeHtml(question)}</div>${x.revealed?`<div class="answer"><strong>영단어</strong>: ${escapeHtml(card.word)}<div><strong>뜻</strong>: ${escapeHtml(card.meaning)}</div></div>`:''}${x.hint?`<div class="hint">${card.hint?escapeHtml(card.hint):'등록된 힌트가 없습니다'}</div>`:''}<div class="feedback-mark" aria-hidden="true"></div></div><div class="feedback-actions"><button data-action="hint" ${x.locked?'disabled':''}>힌트 보기</button><button data-action="reveal" ${x.locked?'disabled':''}>정답 보기</button><button class="success" data-action="judge" data-value="correct" ${!x.revealed||x.locked?'disabled':''}>맞춤</button><button class="danger" data-action="judge" data-value="wrong" ${!x.revealed||x.locked?'disabled':''}>틀림</button></div><p class="muted">단축키: 스페이스바 정답 · H 힌트 · ← 틀림 · → 맞춤</p></section>`}
function renderResult(){const x=session;return `<section class="panel"><h2>학습 결과</h2><p class="muted">이번 회차 학습을 마쳤습니다.</p><div class="result-grid"><div><div>맞춤</div><div class="result-stat">${x.correct}</div></div><div><div>틀림</div><div class="result-stat">${x.wrong}</div></div><div><div>정답률</div><div class="result-stat">${(x.correct/x.ids.length*100).toFixed(1)}%</div></div></div><div class="actions" style="margin-top:24px"><button class="primary" data-action="retryWrong" ${x.wrongIds.length?'':'disabled'}>틀린 카드만 다시 학습</button><button data-action="retrySame">같은 설정으로 다시 시작</button><button data-action="returnList">목록으로 돌아가기</button></div></section>`}
function bind(){app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action,el.dataset.id,el.dataset.value)));
if(screen==='edit'){const name=$('setName');name?.addEventListener('blur',()=>commitName(name));name?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();name.blur()}});$('addCardForm')?.addEventListener('submit',addCard);app.querySelectorAll('.card-edit').forEach(el=>{el.addEventListener('focus',()=>el.dataset.original=el.value);el.addEventListener('blur',()=>commitCard(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}})})}
if(screen==='study'&&!session){$('studySet')?.addEventListener('change',e=>{selected=e.target.value;render()});app.querySelectorAll('input[name="order"]').forEach(r=>r.addEventListener('change',e=>order=e.target.value));app.querySelectorAll('input[name="direction"]').forEach(r=>r.addEventListener('change',e=>direction=e.target.value))}}
function action(a,id,value){if(a==='new'){const name=prompt('새 세트 이름을 입력하세요.');if(name===null)return;if(!name.trim())return flash('세트 이름을 입력하세요.',true);const s={id:uid(),name:name.trim(),createdAt:new Date().toISOString(),cards:[]};db.sets.push(s);save();editing=s.id;setScreen('edit')}
else if(a==='pick'){$('csvPicker').value='';$('csvPicker').click()}
else if(a==='sample')downloadSample();else if(a==='learn'){selected=id;session=null;setScreen('study')}
else if(a==='edit'){editing=id;setScreen('edit')}
else if(a==='back')setScreen('list');else if(a==='export')exportCsv(setById(id));
else if(a==='reset'){if(confirm('이 세트의 맞춤/틀림 기록을 모두 지웁니다. 계속할까요?')){setById(id).cards.forEach(c=>c.status='unseen');save();flash('기록을 초기화했습니다.')}}
else if(a==='deleteSet'){if(confirm('세트와 기록이 모두 삭제되며 되돌릴 수 없습니다.')){db.sets=db.sets.filter(s=>s.id!==id);if(selected===id)selected='';save();flash('세트를 삭제했습니다.')}}
else if(a==='deleteCard')deleteCard(id);else if(a==='undo')undoDelete();
else if(a==='closePreview'){preview=null;render()}else if(a==='confirmImport')importConfirmed();
else if(a==='mode'){mode=value;render()}
else if(a==='start')startSession();else if(a==='stop'){clearTimeout(feedbackTimer);session=null;render()}
else if(a==='hint'){if(session&&!session.locked){session.hint=true;render()}}
else if(a==='reveal'){if(session&&!session.locked){session.revealed=true;render()}}
else if(a==='judge')judge(value);else if(a==='retryWrong'){const ids=session.wrongIds.slice(),old=session;startSession(ids,old.setId,old.order,old.direction)}
else if(a==='retrySame'){const old=session;startSession(null,old.setId,old.order,old.direction,old.mode)}
else if(a==='returnList'){session=null;setScreen('list')}}
function commitName(el){const s=setById(editing);if(!s)return;const v=el.value.trim();if(!v){el.value=s.name;return flash('세트 이름을 입력하세요.',true)}if(v!==s.name){s.name=v;save()}}
function addCard(e){e.preventDefault();const s=setById(editing),form=e.currentTarget;if(!s||s.cards.length>=MAX)return flash('세트당 최대 2,000개까지 추가할 수 있습니다.',true);const word=form.elements.word.value.trim(),meaning=form.elements.meaning.value.trim(),hint=form.elements.hint.value;if(!word||!meaning)return flash('영단어와 뜻은 필수입니다.',true);s.cards.push({id:uid(),word:word.slice(0,100),meaning:meaning.slice(0,300),hint:hint.slice(0,300),status:'unseen'});save();flash('카드를 추가했습니다.')}
function commitCard(el){const s=setById(editing),c=s?.cards.find(c=>c.id===el.dataset.id);if(!c)return;const field=el.dataset.field;const v=field==='hint'?el.value:el.value.trim();if(field!=='hint'&&!v){el.value=c[field];return flash('영단어와 뜻은 비워 둘 수 없습니다. 원래 값으로 되돌렸습니다.',true)}if(c[field]===v)return;c[field]=v;if(field!=='hint'){c.status='unseen';save();flash('상태가 초기화되었습니다')}else save()}
function deleteCard(id){const s=setById(editing),index=s?.cards.findIndex(c=>c.id===id);if(index==null||index<0)return;undo={setId:s.id,index,card:s.cards[index]};s.cards.splice(index,1);save();clearTimeout(undoTimer);const token=undo;undoTimer=setTimeout(()=>{if(undo===token){undo=null;if(screen==='edit')render()}},5000);render()}
function undoDelete(){if(!undo)return;const s=setById(undo.setId);if(s&&s.cards.length<MAX){s.cards.splice(Math.min(undo.index,s.cards.length),0,undo.card);save()}clearTimeout(undoTimer);undo=null;render()}
function startSession(explicitIds=null,setId=selected,ord=order,dir=direction,startMode=mode){const s=setById(setId);if(!s)return;let ids=explicitIds?explicitIds.slice():s.cards.filter(c=>startMode==='all'||c.status===startMode).map(c=>c.id);if(ord==='shuffle'){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}}if(!ids.length)return;session={phase:'run',setId:s.id,ids,index:0,correct:0,wrong:0,wrongIds:[],revealed:false,hint:false,locked:false,mode:startMode,order:ord,direction:dir};render()}
function judge(result){const x=session;if(!x||x.phase!=='run'||!x.revealed||x.locked)return;const card=setById(x.setId)?.cards.find(c=>c.id===x.ids[x.index]);if(!card)return;x.locked=true;card.status=result;save();if(result==='correct')x.correct++;else{x.wrong++;x.wrongIds.push(card.id)}const node=$('studyCard');node.classList.add(result==='correct'?'feedback-correct':'feedback-wrong');node.querySelector('.feedback-mark').textContent=result==='correct'?'✓':'×';app.querySelectorAll('.feedback-actions button').forEach(b=>b.disabled=true);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;feedbackTimer=setTimeout(()=>{if(session!==x)return;if(++x.index>=x.ids.length)x.phase='result';x.revealed=false;x.hint=false;x.locked=false;render()},reduced?300:600)}
function escapeCsv(value){let s=String(value??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csvText(rows){return '\ufeff'+rows.map(row=>row.map(escapeCsv).join(',')).join('\r\n')+'\r\n'}
function download(text,name){const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCsv(s){if(!s)return;const rows=[['word','meaning','hint','status'],...s.cards.map(c=>[c.word,c.meaning,c.hint,c.status])];download(csvText(rows),s.name.replace(/[\\/:*?"<>|]/g,'_')+'.csv')}
function downloadSample(){const rows=[['word','meaning','hint','status'],['apple','사과','과일','correct'],['benevolent','자애로운','b로 시작','wrong'],['book','책','읽는 물건','unseen'],['careful','조심하는','c로 시작','unseen'],['discover','발견하다','d로 시작','unseen']];download(csvText(rows),'샘플_영단어.csv')}
// CSV parser: RFC-style quoted fields with embedded comma, double quote and line breaks.
function parseCsv(text){const rows=[];let fields=[],field='',quoted=false,afterQuote=false,start=1,line=1;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else{quoted=false;afterQuote=true}}else if(c==='\r'){if(text[i+1]==='\n'){field+='\r\n';i++}else field+='\r';line++}else{field+=c;if(c==='\n')line++}}else if(afterQuote){if(c===','){fields.push(field);field='';afterQuote=false}else if(c==='\r'||c==='\n'){fields.push(field);rows.push({cells:fields,line:start});fields=[];field='';afterQuote=false;if(c==='\r'&&text[i+1]==='\n')i++;line++;start=line}else if(c===' '||c==='\t'){}else throw Error('CSV 큰따옴표 형식이 잘못되었습니다. ('+line+'줄)')}else if(c==='"'){if(field!=='')throw Error('CSV 큰따옴표 형식이 잘못되었습니다. ('+line+'줄)');quoted=true}else if(c===','){fields.push(field);field=''}else if(c==='\r'||c==='\n'){fields.push(field);rows.push({cells:fields,line:start});fields=[];field='';if(c==='\r'&&text[i+1]==='\n')i++;line++;start=line}else field+=c}
if(quoted)throw Error('닫히지 않은 큰따옴표가 있습니다.');if(field!==''||fields.length||afterQuote){fields.push(field);rows.push({cells:fields,line:start})}return rows}
function parseImport(text,filename){if(!text.trim())throw Error('빈 파일입니다.');if(text.includes('\ufffd')||text.includes('\u0000'))throw Error('UTF-8 형식의 파일이 필요합니다');const rows=parseCsv(text.replace(/^\ufeff/,''));if(!rows.length)throw Error('빈 파일입니다.');const rawHeader=rows[0].cells,headers=rawHeader.map(x=>x.trim().toLowerCase());if(!headers.includes('word')||!headers.includes('meaning'))throw Error('필수 헤더 word 또는 meaning 열이 없습니다. 쉼표로 구분한 CSV를 확인하세요.');const wi=headers.indexOf('word'),mi=headers.indexOf('meaning'),hi=headers.indexOf('hint'),si=headers.indexOf('status');const unknown=rawHeader.filter((v,i)=>!['word','meaning','hint','status'].includes(headers[i]));let cards=[],skipped=[],trimmed=0,duplicates=0,truncated=false;const seen=new Set();for(const row of rows.slice(1)){if(row.cells.length===1&&row.cells[0]==='')continue;const w=(row.cells[wi]??'').trim(),m=(row.cells[mi]??'').trim();if(!w||!m){skipped.push(row.line);continue}if(cards.length>=MAX){truncated=true;continue}const duplicate=w.toLocaleLowerCase();if(seen.has(duplicate))duplicates++;seen.add(duplicate);const vals=[w,m,(hi>=0?row.cells[hi]??'':'')];const limits=[100,300,300];vals.forEach((x,i)=>{if(x.length>limits[i]){vals[i]=x.slice(0,limits[i]);trimmed++}});const st=si>=0?(row.cells[si]??'').trim().toLowerCase():'unseen';cards.push({id:uid(),word:vals[0],meaning:vals[1],hint:vals[2],status:VALID.includes(st)?st:'unseen'})}if(!cards.length)throw Error('유효한 카드가 0개입니다. 영단어와 뜻을 확인하세요.');let base=filename.replace(/\.(csv|txt)$/i,'')||'이름 없는 세트';let name=base,n=2;while(db.sets.some(x=>x.name===name)){name=base+' ('+n+++')'}return{filename,name,cards,skipped,duplicates,trimmed,unknown,truncated}}
function importConfirmed(){if(!preview)return;db.sets.push({id:uid(),name:preview.name,createdAt:new Date().toISOString(),cards:preview.cards});const count=preview.cards.length;preview=null;save();flash(count+'개 카드를 불러왔습니다.')}
$('csvPicker').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const bytes=await file.arrayBuffer(),decoder=new TextDecoder('utf-8',{fatal:true});const text=decoder.decode(bytes);preview=parseImport(text,file.name);notice='';render();$('csvPreview')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(err){preview=null;flash(err instanceof TypeError?'UTF-8 형식의 파일이 필요합니다':err.message,true)}});
$('tabList').addEventListener('click',()=>setScreen('list'));$('tabStudy').addEventListener('click',()=>{if(session){clearTimeout(feedbackTimer);session=null}setScreen('study')});
document.addEventListener('keydown',e=>{if(screen!=='study'||!session||session.phase!=='run'||session.locked)return;if(!matchMedia('(pointer:fine)').matches)return;const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;const k=e.key.toLowerCase();if(e.code==='Space'){e.preventDefault();action('reveal')}else if(e.key==='ArrowLeft'){e.preventDefault();judge('wrong')}else if(e.key==='ArrowRight'){e.preventDefault();judge('correct')}else if(k==='h'){action('hint')}});
load();render();
})();
