<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>영단어 플래시카드</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f7fc;color:#1c2a42;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:1px solid #cbd5e1;background:#fff;color:#172b49;padding:10px 13px;min-height:44px;border-radius:9px;cursor:pointer;font-weight:600}button:hover:not(:disabled){background:#eff3fb}button:disabled{opacity:.42;cursor:not-allowed}button.primary{background:#275bd3;border-color:#275bd3;color:white}button.primary:hover{background:#1746b2}button.danger{color:#ac2432;border-color:#eec6cc}button.success{color:#167145;border-color:#ace1c5}input,select{border:1px solid #bac7dc;border-radius:9px;background:white;color:#1c2a42;padding:10px 12px;min-width:0;width:100%}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #9bb8fa;outline-offset:2px}.shell{width:min(1100px,100%);padding:0 18px;margin:auto}header{background:white;border-bottom:1px solid #dfe5ee}header h1{font-size:1.5rem;margin:0;padding:18px 0 12px}.tabs{display:flex;gap:8px}.tabs button{border-radius:9px 9px 0 0;border-bottom:0}.tabs button.active{background:#e8f0ff;color:#194ba8}main{padding-top:22px!important;padding-bottom:52px!important}.panel{background:white;border:1px solid #dfe6f0;border-radius:15px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px #152f4d09}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}.toolbar h2{margin:0;font-size:1.28rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#556783}.notice{padding:12px 14px;border-radius:9px;background:#eaf2ff;color:#244b90;margin-bottom:14px;overflow-wrap:anywhere}.notice.error{background:#fff0f0;color:#a32738}.empty{text-align:center;padding:48px 15px}.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.setrow h3{margin:0 0 10px;overflow-wrap:anywhere}.stats{display:flex;gap:15px;flex-wrap:wrap;color:#53647c;font-size:.95rem}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}h3{font-size:1.05rem}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #e4e9f2;overflow-wrap:anywhere}th{background:#f4f7fc;color:#425572}td input{padding:8px 7px}th:nth-child(1){width:10%}th:nth-child(2){width:22%}th:nth-child(3){width:24%}th:nth-child(4){width:24%}th:nth-child(5){width:11%}th:nth-child(6){width:9%}.pill{display:inline-block;border-radius:22px;padding:5px 8px;background:#eef1f6;font-size:.85rem}.pill.correct{background:#e0f6e9;color:#167145}.pill.wrong{background:#ffe9e9;color:#a52b38}.drag-handle{font-size:20px;cursor:grab;border:1px solid transparent;background:transparent;padding:6px;min-height:44px;touch-action:none;user-select:none}.drag-handle:active{cursor:grabbing}.drag-handle:disabled{opacity:.24;cursor:not-allowed}.numcell{display:flex;align-items:center;gap:3px;white-space:nowrap}.edit-table tr.dragging{opacity:.4}.edit-table tr.drop-before{box-shadow:inset 0 4px #275bd3}.edit-table tr.drop-after{box-shadow:inset 0 -4px #275bd3}.sort-field{display:flex;align-items:center;gap:10px;max-width:320px}.sort-field select{min-width:170px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.options button{min-height:70px;text-align:left}.options button.selected{background:#e7efff;border:2px solid #275bd3;color:#1848ad}.options small{display:block;font-weight:400;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.radios{display:flex;gap:14px;flex-wrap:wrap}.radios label{display:flex;align-items:center;gap:7px}.radios input{width:auto;accent-color:#275bd3}.progress-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.progress-head h2{margin:0}.progress{height:12px;border-radius:20px;background:#e1e8f2;margin-top:15px;overflow:hidden}.progress div{height:100%;background:#275bd3}.flashcard{min-height:330px;border:3px solid #cad7ec;border-radius:20px;margin:22px 0 16px;padding:95px 20px 28px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;position:relative;overflow-wrap:anywhere}.card-hint-button{position:absolute;right:14px;top:15px;min-height:44px;z-index:1}.card-hint-button[aria-pressed=true]{background:#e3edff;border-color:#3367d6;color:#194ba8}.card-field{font-size:1rem;color:#526780;font-weight:650;margin-bottom:10px}.question{font-size:clamp(32px,5vw,52px);font-weight:750;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}.answer{margin-top:20px;border-top:1px solid #e0e7f2;padding-top:20px;font-size:1.17rem;line-height:1.7;white-space:pre-wrap;width:100%}.hint{background:#f1f6ff;border-radius:10px;padding:12px;width:100%;white-space:pre-wrap;margin-top:16px}.study-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.flashcard.feedback-correct{background:#f3fff8;border-color:#22a563}.flashcard.feedback-wrong{background:#fff5f5;border-color:#da4050;animation:shake .6s}.mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:100px;opacity:0;font-weight:900;pointer-events:none}.feedback-correct .mark{color:#109653;animation:pop .6s}.feedback-wrong .mark{color:#d52e42;animation:pop .6s}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.results>div{border:1px solid #e0e7f0;border-radius:12px;padding:20px 8px}.results strong{display:block;font-size:2rem}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#192a44;color:white;border-radius:13px;box-shadow:0 10px 40px #101b385c;display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:calc(100vw - 24px);width:max-content;padding:12px 14px;z-index:1000}.toast button{min-height:44px}.toast .close{color:white;background:transparent;border-color:#71819e}#csvPicker{display:none}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.flashcard.feedback-wrong,.feedback-correct .mark,.feedback-wrong .mark{animation:none}.feedback-correct .mark,.feedback-wrong .mark{opacity:1}}@media(max-width:700px){.shell{padding-left:12px;padding-right:12px}.panel{padding:15px}.grid3,.grid2,.options{grid-template-columns:1fr}.edit-table,.edit-table tbody,.edit-table tr,.edit-table td{display:block;width:100%!important}.edit-table thead{display:none}.edit-table tr{border:1px solid #dfe5ee;border-radius:11px;padding:11px;margin-bottom:10px}.edit-table td{display:flex;align-items:center;gap:8px;border:0;padding:6px 0}.edit-table td::before{content:attr(data-label);flex:0 0 64px;font-weight:650;color:#52627b}.edit-table td input{flex:1;min-width:0}.edit-table .numcell{justify-content:flex-start}.edit-table tr.drop-before{box-shadow:inset 0 4px #275bd3}.edit-table tr.drop-after{box-shadow:inset 0 -4px #275bd3}.flashcard{padding:94px 12px 25px;min-height:285px}.results>div{padding:13px 3px}.results strong{font-size:1.5rem}.sort-field{width:100%;max-width:none}.toast{bottom:10px;gap:8px;justify-content:center}}
</style></head><body><div id="saveWarning" class="notice error" style="display:none;text-align:center;margin:0;border-radius:0" role="alert">저장에 실패했습니다. CSV로 내보내 백업하세요.</div><header><div class="shell"><h1>영단어 플래시카드</h1><nav class="tabs" aria-label="화면 선택"><button id="tabList" class="active">카드 세트 목록</button><button id="tabStudy">학습</button></nav></div></header><main class="shell" id="app"></main><div id="toastHost"></div><input type="file" accept=".csv,.txt,text/csv,text/plain" id="csvPicker"><script>
'use strict';(()=>{
const KEY='vocab-flashcards-v1',MAX=2000,STATES=['unseen','correct','wrong'];
const app=document.getElementById('app'),toastHost=document.getElementById('toastHost'),$=id=>document.getElementById(id);
let db={sets:[]},screen='list',editing=null,selected='',mode='all',order='shuffle',direction='word',editSort='saved',session=null,preview=null,undo=null,undoTimer=null,feedbackTimer=null,notice='',noticeError=false,drag=null;
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const get=id=>db.sets.find(s=>s.id===id);
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const val=JSON.parse(raw);if(!val||!Array.isArray(val.sets)||!val.sets.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&Array.isArray(s.cards)&&s.cards.length<=MAX&&s.cards.every(c=>typeof c.id==='string'&&typeof c.word==='string'&&typeof c.meaning==='string'&&typeof c.hint==='string'&&STATES.includes(c.status))))throw Error('invalid');db=val}catch(e){try{const raw=localStorage.getItem(KEY);if(raw!==null)localStorage.setItem(KEY+'-broken',raw)}catch(e){}db={sets:[]};notice='저장된 데이터를 읽을 수 없습니다';noticeError=true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('saveWarning').style.display='none'}catch(e){$('saveWarning').style.display='block'}}
function counts(s){return{all:s.cards.length,correct:s.cards.filter(c=>c.status==='correct').length,wrong:s.cards.filter(c=>c.status==='wrong').length,unseen:s.cards.filter(c=>c.status==='unseen').length}}
const statusName=x=>x==='correct'?'맞춤':x==='wrong'?'틀림':'미학습';
function stats(s){const c=counts(s);return `<div class="stats"><span>전체 <b>${c.all}</b></span><span>맞춤 <b>${c.correct}</b></span><span>틀림 <b>${c.wrong}</b></span><span>미학습 <b>${c.unseen}</b></span></div>`}
function showNotice(t,error=false){notice=t;noticeError=error;render()}
function hideToast(){undo=null;clearTimeout(undoTimer);toastHost.replaceChildren()}
function showToast(){if(!undo){hideToast();return}toastHost.innerHTML='<div class="toast" role="status"><span>카드를 삭제했습니다</span><button data-toast="undo">삭제 취소</button><button class="close" data-toast="close">닫기</button></div>';toastHost.querySelector('[data-toast="undo"]').onclick=restoreCard;toastHost.querySelector('[data-toast="close"]').onclick=hideToast}
function navigate(to){if(session&&to!=='study'){clearTimeout(feedbackTimer);session=null}if(screen==='edit'&&to!=='edit'){hideToast();editSort='saved'}screen=to;notice='';render()}
function render(){const list=screen==='list'||screen==='edit';$('tabList').classList.toggle('active',list);$('tabStudy').classList.toggle('active',!list);app.innerHTML=(notice?`<div class="notice ${noticeError?'error':''}" role="status">${esc(notice)}</div>`:'')+(screen==='list'?viewList():screen==='edit'?viewEdit():viewStudy());bind()}
function viewList(){return `<div class="toolbar"><h2>카드 세트 목록</h2><div class="actions"><button class="primary" data-act="new">새 세트 만들기</button><button data-act="pick">CSV 불러오기</button></div></div>${!db.sets.length?`<section class="panel empty"><p>카드 세트가 없습니다. 새로 만들거나 CSV 파일을 불러오세요.</p><button data-act="sample">샘플 CSV 받기</button></section>`:db.sets.map(s=>`<section class="panel setrow"><div><h3>${esc(s.name)}</h3>${stats(s)}</div><div class="actions"><button class="primary" data-act="learn" data-id="${esc(s.id)}">학습하기</button><button data-act="edit" data-id="${esc(s.id)}">편집</button><button data-act="export" data-id="${esc(s.id)}">CSV 내보내기</button><button data-act="reset" data-id="${esc(s.id)}">기록 초기화</button><button class="danger" data-act="deleteSet" data-id="${esc(s.id)}">삭제</button></div></section>`).join('')}${preview?viewPreview():''}`}
function viewPreview(){const p=preview,part=p.skipped.slice(0,10);return `<section class="panel" id="csvPreview"><div class="toolbar"><h2>CSV 불러오기 미리보기</h2><button data-act="closePreview">닫기</button></div><p>파일: ${esc(p.filename)}</p><p>새 세트: ${esc(p.name)}</p><p>가져올 카드: ${p.cards.length}개</p><p>건너뛴 줄: ${p.skipped.length}개${part.length?' (줄 번호: '+part.join(', ')+(p.skipped.length>10?' 외 '+(p.skipped.length-10)+'줄':'')+')':''}</p><p>중복 단어: ${p.duplicates}개 / 잘라낸 칸: ${p.trimmed}개</p><p>무시한 열: ${esc(p.unknown.join(', ')||'없음')}</p>${p.truncated?'<p class="notice">2,000개를 초과하여 앞의 2,000개만 가져옵니다.</p>':''}<div class="actions"><button class="primary" data-act="confirmImport">불러오기</button><button data-act="closePreview">취소</button></div></section>`}
function sortedCards(s){const list=s.cards.map((c,i)=>({c,i}));const collator=new Intl.Collator('ko',{sensitivity:'base'}),eng=new Intl.Collator('en',{sensitivity:'base'});list.sort((a,b)=>{let v=0;if(editSort==='word-asc')v=eng.compare(a.c.word,b.c.word);else if(editSort==='word-desc')v=eng.compare(b.c.word,a.c.word);else if(editSort==='meaning-asc')v=collator.compare(a.c.meaning,b.c.meaning);else if(editSort==='meaning-desc')v=collator.compare(b.c.meaning,a.c.meaning);else if(editSort==='status')v=({wrong:0,unseen:1,correct:2}[a.c.status])-({wrong:0,unseen:1,correct:2}[b.c.status]);return v||a.i-b.i});return list.map(x=>x.c)}
function viewEdit(){const s=get(editing);if(!s){screen='list';return viewList()}return `<div class="toolbar"><h2>카드 세트 편집</h2><button data-act="back">목록으로</button></div><section class="panel"><label class="field"><b>세트 이름</b><input id="setName" maxlength="200" value="${esc(s.name)}"></label><div style="margin-top:12px">${stats(s)}</div></section><section class="panel"><h3>카드 추가</h3><form id="addForm" class="grid3"><label class="field">영단어 (필수)<input name="word" maxlength="100" required></label><label class="field">뜻 (필수)<input name="meaning" maxlength="300" required></label><label class="field">힌트 (선택)<input name="hint" maxlength="300"></label><div><button type="submit" class="primary" ${s.cards.length>=MAX?'disabled':''}>추가</button></div></form>${s.cards.length>=MAX?'<p class="notice error">세트당 최대 2,000개까지 추가할 수 있습니다.</p>':''}</section><section class="panel"><div class="toolbar"><h3 style="margin:0">카드 목록</h3><label class="sort-field">정렬 <select id="sortSelect">${[['saved','저장된 순서'],['word-asc','영단어 A-Z'],['word-desc','영단어 Z-A'],['meaning-asc','뜻 가나다순'],['meaning-desc','뜻 가나다 역순'],['status','상태별']].map(([v,t])=>`<option value="${v}" ${editSort===v?'selected':''}>${t}</option>`).join('')}</select></label></div>${s.cards.length?`<table class="edit-table"><thead><tr><th>번호</th><th>영단어</th><th>뜻</th><th>힌트</th><th>상태</th><th>삭제</th></tr></thead><tbody>${sortedCards(s).map((c,i)=>`<tr data-card="${esc(c.id)}"><td data-label="번호"><span class="numcell"><button type="button" class="drag-handle" aria-label="${i+1}번 카드 끌기" title="끌어서 순서 변경" ${editSort!=='saved'?'disabled':''}>⠿</button><span>${i+1}</span></span></td><td data-label="영단어"><input class="card-edit" data-id="${esc(c.id)}" data-field="word" value="${esc(c.word)}" maxlength="100" aria-label="${i+1}번 영단어"></td><td data-label="뜻"><input class="card-edit" data-id="${esc(c.id)}" data-field="meaning" value="${esc(c.meaning)}" maxlength="300" aria-label="${i+1}번 뜻"></td><td data-label="힌트"><input class="card-edit" data-id="${esc(c.id)}" data-field="hint" value="${esc(c.hint)}" maxlength="300" aria-label="${i+1}번 힌트"></td><td data-label="상태"><span class="pill ${esc(c.status)}">${statusName(c.status)}</span></td><td data-label="삭제"><button class="danger" data-act="deleteCard" data-id="${esc(c.id)}">삭제</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">등록된 카드가 없습니다.</p>'}</section>`}
function viewStudy(){if(session?.phase==='run')return viewRunning();if(session?.phase==='result')return viewResult();const s=get(selected),c=s?counts(s):{all:0,correct:0,wrong:0},n=c[mode];return `<div class="toolbar"><h2>학습 시작</h2></div><section class="panel"><label class="field"><b>카드 세트 선택</b><select id="studySet"><option value="">세트를 선택하세요</option>${db.sets.map(s=>`<option value="${esc(s.id)}" ${selected===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><h3 style="margin-top:24px">학습 모드</h3><div class="options">${[['all','전체 학습'],['correct','맞춘 카드 복습'],['wrong','틀린 카드 집중 학습']].map(([v,t])=>`<button data-act="mode" data-value="${v}" class="${mode===v?'selected':''}" aria-pressed="${mode===v}">${t}<small>${c[v]}개 카드</small></button>`).join('')}</div><div class="grid2" style="margin-top:24px"><div><h3>카드 순서</h3><div class="radios"><label><input type="radio" name="order" value="shuffle" ${order==='shuffle'?'checked':''}>섞기</label><label><input type="radio" name="order" value="original" ${order==='original'?'checked':''}>원래 순서</label></div></div><div><h3>카드 방향</h3><div class="radios"><label><input type="radio" name="direction" value="word" ${direction==='word'?'checked':''}>영단어 → 뜻</label><label><input type="radio" name="direction" value="meaning" ${direction==='meaning'?'checked':''}>뜻 → 영단어</label></div></div></div><div style="margin-top:24px">${!n?'<p class="notice">해당하는 카드가 없습니다</p>':''}<button class="primary" data-act="start" ${n?'':'disabled'}>시작</button></div></section>`}
function viewRunning(){const x=session,s=get(x.setId),card=s?.cards.find(c=>c.id===x.ids[x.index]);if(!card){session=null;return viewStudy()}const label=x.direction==='word'?'영단어':'뜻',question=x.direction==='word'?card.word:card.meaning;return `<section class="panel"><div class="progress-head"><h2>${x.index+1} / ${x.ids.length}</h2><div class="actions"><button data-act="previous" ${!canPrevious()?'disabled':''}>이전 카드</button><button data-act="stop">학습 종료</button></div></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${x.ids.length}" aria-valuenow="${x.index}"><div style="width:${100*x.index/x.ids.length}%"></div></div><div id="studyCard" class="flashcard"><button class="card-hint-button" data-act="hint" aria-pressed="${x.hint}" ${x.locked?'disabled':''}>힌트 보기</button><div class="card-field">${label}</div><div class="question">${esc(question)}</div>${x.revealed?`<div class="answer"><strong>영단어</strong>: ${esc(card.word)}<div><strong>뜻</strong>: ${esc(card.meaning)}</div></div>`:''}${x.hint?`<div class="hint">${esc(card.hint||'등록된 힌트가 없습니다')}</div>`:''}<div class="mark" aria-hidden="true"></div></div><div class="study-actions"><button data-act="reveal" ${x.locked?'disabled':''}>정답 보기</button><button class="success" data-act="judge" data-value="correct" ${!x.revealed||x.locked?'disabled':''}>맞춤</button><button class="danger" data-act="judge" data-value="wrong" ${!x.revealed||x.locked?'disabled':''}>틀림</button></div><p class="muted">단축키: 스페이스바 정답 · H 힌트 · ← 틀림 · → 맞춤 · Backspace 이전 카드</p></section>`}
function viewResult(){const x=session;return `<section class="panel"><h2>학습 결과</h2><p class="muted">이번 회차 학습을 마쳤습니다.</p><div class="results"><div>맞춤<strong>${x.correct}</strong></div><div>틀림<strong>${x.wrong}</strong></div><div>정답률<strong>${(x.correct/x.ids.length*100).toFixed(1)}%</strong></div></div><div class="actions" style="margin-top:22px"><button class="primary" data-act="retryWrong" ${x.wrongIds.length?'':'disabled'}>틀린 카드만 다시 학습</button><button data-act="retrySame">같은 설정으로 다시 시작</button><button data-act="returnList">목록으로 돌아가기</button></div></section>`}
function bind(){app.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.act,el.dataset.id,el.dataset.value)));if(screen==='edit'){const input=$('setName');input?.addEventListener('blur',()=>commitName(input));input?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}});$('addForm')?.addEventListener('submit',addCard);$('sortSelect')?.addEventListener('change',e=>{editSort=e.target.value;render()});app.querySelectorAll('.card-edit').forEach(el=>{el.addEventListener('blur',()=>commitCard(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}})});setupDrag()}if(screen==='study'&&!session){$('studySet')?.addEventListener('change',e=>{selected=e.target.value;render()});app.querySelectorAll('[name=order]').forEach(el=>el.onchange=e=>order=e.target.value);app.querySelectorAll('[name=direction]').forEach(el=>el.onchange=e=>direction=e.target.value)}}
function action(act,key,v){if(act==='new'){const name=prompt('새 세트 이름을 입력하세요.');if(name===null)return;if(!name.trim())return showNotice('세트 이름을 입력하세요.',true);const s={id:id(),name:name.trim(),createdAt:new Date().toISOString(),cards:[]};db.sets.push(s);save();editing=s.id;editSort='saved';navigate('edit')}
else if(act==='pick'){$('csvPicker').value='';$('csvPicker').click()}else if(act==='sample')sample();else if(act==='learn'){selected=key;session=null;navigate('study')}else if(act==='edit'){editing=key;editSort='saved';navigate('edit')}else if(act==='back')navigate('list');else if(act==='export')exportSet(get(key));else if(act==='reset'){if(confirm('이 세트의 맞춤/틀림 기록을 모두 지웁니다. 계속할까요?')){get(key).cards.forEach(c=>c.status='unseen');save();showNotice('기록을 초기화했습니다.')}}else if(act==='deleteSet'){if(confirm('세트와 기록이 모두 삭제되며 되돌릴 수 없습니다.')){db.sets=db.sets.filter(s=>s.id!==key);if(selected===key)selected='';save();showNotice('세트를 삭제했습니다.')}}else if(act==='deleteCard')deleteCard(key);else if(act==='closePreview'){preview=null;render()}else if(act==='confirmImport')confirmImport();else if(act==='mode'){mode=v;render()}else if(act==='start')startSession();else if(act==='stop'){clearTimeout(feedbackTimer);session=null;render()}else if(act==='previous')previous();else if(act==='hint'){if(session&&!session.locked){session.hint=!session.hint;render()}}else if(act==='reveal'){if(session&&!session.locked){session.revealed=true;render()}}else if(act==='judge')judge(v);else if(act==='retryWrong'){const x=session;startSession(x.wrongIds.slice(),x.setId,x.order,x.direction,x.mode)}else if(act==='retrySame'){const x=session;startSession(null,x.setId,x.order,x.direction,x.mode)}else if(act==='returnList'){session=null;navigate('list')}}
function commitName(el){const s=get(editing);if(!s)return;const name=el.value.trim();if(!name){el.value=s.name;return showNotice('세트 이름을 입력하세요.',true)}if(name!==s.name){s.name=name;save()}}
function addCard(e){e.preventDefault();const s=get(editing),f=e.currentTarget;if(!s||s.cards.length>=MAX)return showNotice('세트당 최대 2,000개까지 추가할 수 있습니다.',true);const word=f.elements.word.value.trim(),meaning=f.elements.meaning.value.trim(),hint=f.elements.hint.value;if(!word||!meaning)return showNotice('영단어와 뜻은 필수입니다.',true);s.cards.push({id:id(),word:word.slice(0,100),meaning:meaning.slice(0,300),hint:hint.slice(0,300),status:'unseen'});save();showNotice('카드를 추가했습니다.')}
function commitCard(el){const s=get(editing),c=s?.cards.find(c=>c.id===el.dataset.id);if(!c)return;const field=el.dataset.field,value=field==='hint'?el.value:el.value.trim();if(field!=='hint'&&!value){el.value=c[field];return showNotice('영단어와 뜻은 비워 둘 수 없습니다. 원래 값으로 되돌렸습니다.',true)}if(c[field]===value)return;c[field]=value;if(field!=='hint'){c.status='unseen';save();showNotice('상태가 초기화되었습니다')}else save()}
function deleteCard(key){const s=get(editing),i=s?.cards.findIndex(c=>c.id===key);if(i==null||i<0)return;hideToast();undo={setId:s.id,index:i,card:s.cards[i]};s.cards.splice(i,1);save();render();showToast();const token=undo;undoTimer=setTimeout(()=>{if(undo===token)hideToast()},5000)}
function restoreCard(){if(!undo)return;const s=get(undo.setId);if(s&&s.cards.length<MAX){s.cards.splice(Math.min(undo.index,s.cards.length),0,undo.card);save()}hideToast();render()}
function setupDrag(){if(editSort!=='saved')return;app.querySelectorAll('.drag-handle').forEach(handle=>handle.addEventListener('pointerdown',startDrag))}
function startDrag(e){if(e.button!==0||drag)return;const handle=e.currentTarget,source=handle.closest('tr'),tbody=source?.parentElement;if(!source||!tbody)return;e.preventDefault();handle.setPointerCapture(e.pointerId);drag={pointer:e.pointerId,handle,source,tbody,target:null,before:false,clientY:e.clientY,raf:0,move:null,end:null};source.classList.add('dragging');const move=ev=>{if(!drag||ev.pointerId!==drag.pointer)return;ev.preventDefault();drag.clientY=ev.clientY;updateDragTarget(ev.clientY);if(!drag.raf)drag.raf=requestAnimationFrame(autoScroll)};const end=ev=>{if(!drag||ev.pointerId!==drag.pointer)return;ev.preventDefault();const d=drag;drag=null;cancelAnimationFrame(d.raf);d.handle.removeEventListener('pointermove',d.move);d.handle.removeEventListener('pointerup',d.end);d.handle.removeEventListener('pointercancel',d.end);d.source.classList.remove('dragging');d.tbody.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));if(ev.type==='pointercancel'||!d.target||d.target===d.source)return;const s=get(editing);if(!s)return;const from=s.cards.findIndex(c=>c.id===d.source.dataset.card);const to=s.cards.findIndex(c=>c.id===d.target.dataset.card);if(from<0||to<0)return;const [item]=s.cards.splice(from,1);let insertion=to+(d.before?0:1);if(from<insertion)insertion--;s.cards.splice(insertion,0,item);save();render()};drag.move=move;drag.end=end;handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end)}
function updateDragTarget(y){if(!drag)return;const d=drag;const rows=[...d.tbody.querySelectorAll('tr')].filter(r=>r!==d.source);let target=null,before=true,min=Infinity;for(const row of rows){const box=row.getBoundingClientRect();if(box.bottom<0||box.top>innerHeight)continue;const mid=(box.top+box.bottom)/2,dist=Math.abs(mid-y);if(dist<min){target=row;before=y<mid;min=dist}}d.tbody.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));d.target=target;d.before=before;if(target)target.classList.add(before?'drop-before':'drop-after')}
function autoScroll(){if(!drag)return;const y=drag.clientY,edge=85;let speed=0;if(y<edge)speed=-Math.min(20,(edge-y)/3);if(y>innerHeight-edge)speed=Math.min(20,(y-(innerHeight-edge))/3);if(speed){window.scrollBy(0,speed);updateDragTarget(y)}drag.raf=requestAnimationFrame(autoScroll)}
function startSession(explicit=null,setId=selected,ord=order,dir=direction,m=mode){const s=get(setId);if(!s)return;const ids=explicit?explicit.slice():s.cards.filter(c=>m==='all'||c.status===m).map(c=>c.id);if(ord==='shuffle')for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}if(!ids.length)return;session={phase:'run',setId:s.id,ids,index:0,correct:0,wrong:0,wrongIds:[],revealed:false,hint:false,locked:false,mode:m,order:ord,direction:dir,lastJudgment:null,returned:false};render()}
function canPrevious(){const x=session;return !!(x&&x.phase==='run'&&!x.locked&&x.index>0&&!x.returned&&x.lastJudgment&&x.lastJudgment.index===x.index-1)}
function previous(){if(!canPrevious())return;const x=session,old=x.lastJudgment,card=get(x.setId)?.cards.find(c=>c.id===old.id);if(!card)return;card.status=old.previousStatus;save();if(old.result==='correct')x.correct--;else{x.wrong--;const i=x.wrongIds.lastIndexOf(old.id);if(i>=0)x.wrongIds.splice(i,1)}x.index--;x.revealed=false;x.hint=false;x.returned=true;x.lastJudgment=null;render()}
function judge(result){const x=session;if(!x||x.phase!=='run'||!x.revealed||x.locked)return;const card=get(x.setId)?.cards.find(c=>c.id===x.ids[x.index]);if(!card)return;x.locked=true;x.lastJudgment={id:card.id,index:x.index,previousStatus:card.status,result};card.status=result;save();if(result==='correct')x.correct++;else{x.wrong++;x.wrongIds.push(card.id)}const el=$('studyCard');el.classList.add(result==='correct'?'feedback-correct':'feedback-wrong');el.querySelector('.mark').textContent=result==='correct'?'✓':'×';app.querySelectorAll('button').forEach(b=>b.disabled=true);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;feedbackTimer=setTimeout(()=>{if(session!==x)return;x.index++;if(x.index===x.ids.length)x.phase='result';x.revealed=false;x.hint=false;x.locked=false;x.returned=false;render()},reduced?300:600)}
function csvEscape(x){let s=String(x??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csvText(rows){return '\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n')+'\r\n'}
function download(content,name){const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportSet(s){if(!s)return;download(csvText([['word','meaning','hint','status'],...s.cards.map(c=>[c.word,c.meaning,c.hint,c.status])]),s.name.replace(/[\\/:*?"<>|]/g,'_')+'.csv')}
function sample(){download(csvText([['word','meaning','hint','status'],['apple','사과','과일','correct'],['benevolent','자애로운','b로 시작','wrong'],['book','책','읽는 물건','unseen'],['careful','조심하는','c로 시작','unseen'],['discover','발견하다','d로 시작','unseen']]),'샘플_영단어.csv')}
function parseCsv(str){let rows=[],cols=[],field='',quoted=false,after=false,line=1,start=1;for(let i=0;i<str.length;i++){const ch=str[i];if(quoted){if(ch==='"'){if(str[i+1]==='"'){field+='"';i++}else{quoted=false;after=true}}else if(ch==='\r'){if(str[i+1]==='\n'){field+='\r\n';i++}else field+='\r';line++}else{field+=ch;if(ch==='\n')line++}}else if(after){if(ch===','){cols.push(field);field='';after=false}else if(ch==='\r'||ch==='\n'){cols.push(field);rows.push({cells:cols,line:start});cols=[];field='';after=false;if(ch==='\r'&&str[i+1]==='\n')i++;line++;start=line}else if(ch!==' '&&ch!=='\t')throw Error('CSV 큰따옴표 형식이 잘못되었습니다. ('+line+'줄)')}else if(ch==='"'){if(field!=='')throw Error('CSV 큰따옴표 형식이 잘못되었습니다. ('+line+'줄)');quoted=true}else if(ch===','){cols.push(field);field=''}else if(ch==='\r'||ch==='\n'){cols.push(field);rows.push({cells:cols,line:start});cols=[];field='';if(ch==='\r'&&str[i+1]==='\n')i++;line++;start=line}else field+=ch}if(quoted)throw Error('닫히지 않은 큰따옴표가 있습니다.');if(field!==''||cols.length||after){cols.push(field);rows.push({cells:cols,line:start})}return rows}
function processCsv(text,filename){if(!text.trim())throw Error('빈 파일입니다.');if(text.includes('\ufffd')||text.includes('\u0000'))throw Error('UTF-8 형식의 파일이 필요합니다');const rows=parseCsv(text.replace(/^\ufeff/,''));if(!rows.length)throw Error('빈 파일입니다.');const header=rows[0].cells.map(x=>x.trim().toLowerCase());if(!header.includes('word')||!header.includes('meaning'))throw Error('필수 헤더 word 또는 meaning 열이 없습니다.');const wi=header.indexOf('word'),mi=header.indexOf('meaning'),hi=header.indexOf('hint'),si=header.indexOf('status');let cards=[],skipped=[],trimmed=0,duplicates=0,truncated=false,seen=new Set();for(const r of rows.slice(1)){if(r.cells.length===1&&r.cells[0]==='')continue;const w=(r.cells[wi]??'').trim(),m=(r.cells[mi]??'').trim();if(!w||!m){skipped.push(r.line);continue}if(cards.length>=MAX){truncated=true;continue}const code=w.toLocaleLowerCase();if(seen.has(code))duplicates++;seen.add(code);const values=[w,m,hi<0?'':r.cells[hi]??''],limits=[100,300,300];values.forEach((v,i)=>{if(v.length>limits[i]){values[i]=v.slice(0,limits[i]);trimmed++}});const state=si<0?'unseen':(r.cells[si]??'').trim().toLowerCase();cards.push({id:id(),word:values[0],meaning:values[1],hint:values[2],status:STATES.includes(state)?state:'unseen'})}if(!cards.length)throw Error('유효한 카드가 0개입니다. 영단어와 뜻을 확인하세요.');const base=filename.replace(/\.(csv|txt)$/i,'')||'이름 없는 세트';let name=base,n=2;while(db.sets.some(s=>s.name===name))name=base+' ('+n+++')';return{filename,name,cards,skipped,duplicates,trimmed,truncated,unknown:rows[0].cells.filter((x,i)=>!['word','meaning','hint','status'].includes(header[i]))}}
function confirmImport(){if(!preview)return;const total=preview.cards.length;db.sets.push({id:id(),name:preview.name,createdAt:new Date().toISOString(),cards:preview.cards});preview=null;save();showNotice(total+'개 카드를 불러왔습니다.')}
$('csvPicker').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());preview=processCsv(text,file.name);notice='';render();$('csvPreview')?.scrollIntoView({block:'start'})}catch(err){preview=null;showNotice(err instanceof TypeError?'UTF-8 형식의 파일이 필요합니다':err.message,true)}};
$('tabList').onclick=()=>navigate('list');$('tabStudy').onclick=()=>{clearTimeout(feedbackTimer);session=null;navigate('study')};
document.addEventListener('keydown',e=>{if(screen!=='study'||!session||session.phase!=='run'||session.locked||!matchMedia('(pointer:fine)').matches)return;if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=e.key.toLowerCase();if(e.code==='Space'){e.preventDefault();action('reveal')}else if(e.key==='ArrowLeft'){e.preventDefault();judge('wrong')}else if(e.key==='ArrowRight'){e.preventDefault();judge('correct')}else if(k==='h')action('hint');else if(e.key==='Backspace'){e.preventDefault();previous()}});
load();render();
})();
</script></body></html>
